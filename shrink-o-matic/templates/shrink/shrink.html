{% extends "base.html" %}

{% block content %}
<div class="mt-10 max-w-3xl mx-auto">
    <h1 class="text-4xl font-bold text-center mb-6">Create New Shrink</h1>
    <form action="/shrink" method="POST" class="flex flex-col sm:flex-row items-center gap-4">
        <label for="url" class="sr-only">Enter URL to shrink:</label>
        <input type="url" id="url" name="url" required placeholder="https://example.com" class="w-full text-lg p-4 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-500">
        <button type="submit" class="w-full sm:w-auto bg-gray-800 text-white font-bold text-lg py-4 px-8 rounded-md hover:bg-black transition-colors">Shrink URL</button>
    </form>
</div>
{% endblock %}
